<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Explore dog images and breeds using the Dog CEO API">
	<title>Dog Information | Charles Howe</title>
	<link rel="stylesheet" href="css/dog-information.css">
</head>
<body>
	<header class="site-header">
		<nav aria-label="Main navigation">
			<a href="index.html">Back to portfolio</a>
		</nav>
		<h1>Doggies!</h1>
		<p>Click one of the buttons below to view a list of dog breeds or dog pictures!</p>
	</header>

	<main>
		<div class="controls" aria-label="Dog data navigation">
			<button type="button" id="image-button">Show a random dog</button>
			<button type="button" id="breeds-button">Show dog breeds</button>
		</div>

		<p id="status" role="status" aria-live="polite"></p>

		<section id="image-view" class="data-view" aria-labelledby="image-heading">
			<h2 id="image-heading">Random dog</h2>
			<img id="dog-image" alt="" hidden>
		</section>

		<section id="breeds-view" class="data-view" aria-labelledby="breeds-heading" hidden>
			<h2 id="breeds-heading">Dog breeds</h2>
			<ul id="breeds-list"></ul>
		</section>
	</main>

	<script src="js/dog-information.js"></script>
</body>
</html>
